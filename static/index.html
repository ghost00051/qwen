<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Qwen Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo">Q</div>
                <div>
                    <div class="brand-title">Qwen Web</div>
                    <div class="brand-sub">Анализ кода</div>
                </div>
            </div>

            <div>
                <div class="nav-label">Задачи</div>
                <nav class="nav" id="nav"></nav>
            </div>

            <div class="sidebar-footer" id="status-bar">
                <span class="status-dot mock"></span>загрузка...
            </div>
        </aside>

        <main class="main">

            <div class="page-head">
                <h1 class="page-title" id="page-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" id="page-icon"></svg>
                    <span id="page-name">Задача</span>
                </h1>
                <div class="page-desc" id="page-desc"></div>
            </div>

            <div class="card">
                <div class="card-head">
                    <div class="card-title">Файлы</div>
                    <div class="card-actions">
                        <button class="btn btn-sm" onclick="openFilePicker()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            Добавить
                        </button>
                        <button class="btn btn-sm" onclick="clearFiles()" id="clear-files-btn"
                            style="display:none">Убрать все</button>
                    </div>
                </div>

                <div class="dropzone" id="dropzone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <div class="dropzone-title">Перетащи файлы сюда</div>
                    <div class="dropzone-hint" id="dropzone-hint">или нажми «Добавить»</div>
                </div>

                <div class="files-list" id="files-list"></div>

                <input type="file" id="file-input" style="display:none" multiple onchange="onFilePick(event)">
            </div>

            <div class="card">
                <div class="card-head">
                    <div class="card-title">Дополнительный контекст (необязательно)</div>
                    <div class="card-actions">
                        <button class="btn btn-sm" onclick="clearText()">Очистить</button>
                    </div>
                </div>
                <textarea id="text" spellcheck="false"
                    placeholder="Например: это код ответчика ADS-B IN, собран под MISRA C:2012, компилятор GCC ARM..."></textarea>
            </div>

            <div class="run-row">
                <button class="btn btn-primary" id="run-btn" onclick="run()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    Запустить
                </button>
                <span class="hint" id="hint"></span>
            </div>

            <div class="card" id="result-card" style="display:none">
                <div class="card-head">
                    <div class="card-title">Результат</div>
                    <div class="card-actions">
                        <button class="btn btn-sm" onclick="copyResult()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            Копировать
                        </button>
                    </div>
                </div>
                <div class="out-wrap" id="out"></div>
            </div>

            <div class="card" id="raw-card" style="display:none">
                <div class="card-head">
                    <div class="card-title">Сырой ответ модели</div>
                    <div class="card-actions">
                        <button class="btn btn-sm" onclick="toggleRaw(this)">Свернуть</button>
                    </div>
                </div>
                <div class="out-wrap" id="raw" style="font-size:12px; color: var(--text-dim)"></div>
            </div>

        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="./index.js"></script>
</body>

</html>
